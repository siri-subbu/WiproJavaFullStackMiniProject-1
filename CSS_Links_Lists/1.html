<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink Pseudo-Classes</title>
    <style>
        a:link {
            color: #FF0000;
        }

        a:visited {
            color: #FFFF00;
        }

        a:hover {
            color: #FF00FF;
        }

        a:active {
            color: #0000FF;
        }
    </style>
</head>
<body style="background-color: #333333; font-family: Arial, sans-serif; padding: 20px;">

    <a href="https://example.com" target="_blank" style="font-size: 24px;">Test Hyperlink</a>

</body>
</html>
