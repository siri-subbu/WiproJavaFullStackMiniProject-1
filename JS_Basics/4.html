<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Capitalize First Letters</title>
</head>
<body>

    <h2>Capitalize Words</h2>
    <p>Original: <span id="original">the quick brown fox</span></p>
    <p>Formatted: <strong id="output"></strong></p>

    <script>
        function CFL(str) {
            return str
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        const inputStr = "the quick brown fox";
        document.getElementById("output").textContent = CFL(inputStr);
    </script>

</body>
</html>
