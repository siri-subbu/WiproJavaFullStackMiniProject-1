<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Assignment</title>
</head>
<body>

    <div id="visitor-form-section">
        <h1>Visitors information</h1>
        <form action="#" method="post">
            <table cellpadding="6" cellspacing="0">
                <tr>
                    <td><label for="email"><strong>Email Address:</strong></label></td>
                    <td>
                        <input type="email" id="email" name="email" required>
                    </td>
                </tr>
                <tr>
                    <td><strong>Interest:</strong></td>
                    <td>
                        <input type="checkbox" id="research" name="interest" value="research">
                        <label for="research">Research</label>
                        <input type="checkbox" id="purchase" name="interest" value="purchase">
                        <label for="purchase">Purchase</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="occupation"><strong>Occupation:</strong></label></td>
                    <td>
                        <select id="occupation" name="occupation">
                            <option value="" selected>(select one)</option>
                            <option value="student">Student</option>
                            <option value="employed">Employed</option>
                            <option value="self-employed">Self-Employed</option>
                            <option value="retired">Retired</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><strong>Want us to send you junk emails?</strong></td>
                    <td>
                        <input type="radio" id="junk-yes" name="junk_email" value="absolutely">
                        <label for="junk-yes">absolutely</label>
                        <input type="radio" id="junk-no" name="junk_email" value="no_way_man">
                        <label for="junk-no">no way man</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="left">
                        <button type="submit">Submit</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <hr>

    <div id="registration-form-section">
        <center>
            <h2>Online Registration Form</h2>
            <form action="#" method="post">
                <table cellpadding="6" cellspacing="0">
                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td><input type="text" id="username" name="username" required></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password" name="password" required></td>
                    </tr>
                    <tr>
                        <td><label for="confirm_password">Confirm Password:</label></td>
                        <td><input type="password" id="confirm_password" name="confirm_password" required></td>
                    </tr>
                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td><input type="text" id="name" name="name" required></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                            <input type="radio" id="other" name="gender" value="other">
                            <label for="other">Other</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="address">Address:</label></td>
                        <td><textarea id="address" name="address" rows="4" cols="30" required></textarea></td>
                    </tr>
                    <tr>
                        <td><label for="profession">Profession:</label></td>
                        <td>
                            <select id="profession" name="profession" required>
                                <option value="" selected disabled>-- Select Profession --</option>
                                <option value="student">Student</option>
                                <option value="engineer">Engineer</option>
                                <option value="doctor">Doctor</option>
                                <option value="teacher">Teacher</option>
                                <option value="business">Business</option>
                                <option value="other">Other</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Register">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </div>

</body>
</html>
