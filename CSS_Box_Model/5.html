<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Padding Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        p {
            border: 1px solid #999;
            margin-bottom: 20px;
        }

        .para1 {
            padding-left: 3cm;
            background-color: #e8f4f8;
        }

        .para2 {
            padding-right: 50%;
            background-color: #fceded;
        }

        .para3 {
            padding-bottom: 25%;
            background-color: #eef9e8;
        }

        .para4 {
            padding-top: 25%;
            background-color: #fff9e6;
        }
    </style>
</head>
<body>

    <p class="para1">
        <strong>First Paragraph:</strong> This paragraph has a <code>padding-left</code> of 3cm.
    </p>

    <p class="para2">
        <strong>Second Paragraph:</strong> This paragraph has a <code>padding-right</code> of 50%.
    </p>

    <p class="para3">
        <strong>Third Paragraph:</strong> This paragraph has a <code>padding-bottom</code> of 25%.
    </p>

    <p class="para4">
        <strong>Fourth Paragraph:</strong> This paragraph has a <code>padding-top</code> of 25%.
    </p>

</body>
</html>
