<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Margins</title>
    <style>
        .first-para {
            margin-top: 3cm;
            margin-bottom: 5cm;
            background-color: #f0f0f0;
            padding: 10px;
        }

        .second-para {
            margin-left: 2cm;
            background-color: #e0e0e0;
            padding: 10px;
        }

        .third-para {
            margin-top: 25%;
            background-color: #d0d0d0;
            padding: 10px;
        }
    </style>
</head>
<body>

    <p class="first-para">
        First Paragraph: Top margin is set to 3cm, and bottom margin is set to 5cm.
    </p>

    <p class="second-para">
        Second Paragraph: Left margin is set to 2cm.
    </p>

    <p class="third-para">
        Third Paragraph: Top margin is set to 25%.
    </p>

</body>
</html>
