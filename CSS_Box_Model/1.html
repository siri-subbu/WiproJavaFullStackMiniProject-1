<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Width Example</title>
    <style>
        p {
            width: 250px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <p>
        This paragraph is styled to have a fixed total width of 250 pixels.
    </p>

</body>
</html>
