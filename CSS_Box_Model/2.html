<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotted Border Paragraph</title>
    <style>
        p {
            border-width: 10px;
            border-style: dotted;
            border-color: #0000ff;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <p>
        This paragraph is styled with a 10px dotted border in blue (#0000ff).
    </p>

</body>
</html>
