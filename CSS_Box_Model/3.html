<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Margins</title>
    <style>
        p {
            margin-top: 2cm;
            margin-bottom: 25%;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 15px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <p>
        This paragraph has a top margin of 2cm and a bottom margin of 25%.
    </p>

</body>
</html>
