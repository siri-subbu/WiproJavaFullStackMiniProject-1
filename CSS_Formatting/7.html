<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Text Properties</title>
    <style>
        .styled-div {
            color: magenta;
            text-align: right;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 60px;
        }
    </style>
</head>
<body>

    <div class="styled-div">
        This is a styled div demonstration showcasing right alignment, uppercase transformation, underline decoration, magenta text color, and a 60-pixel first-line indentation.
    </div>

</body>
</html>
