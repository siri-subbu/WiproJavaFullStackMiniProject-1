<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Font Properties</title>
    <style>
        .styled-font-div {
            font-family: Verdana, sans-serif;
            font-style: italic;
            font-size: 20px;
            text-align: left;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <div class="styled-font-div">
        This is a styled div displaying italicized, bold Verdana text in red color, sized at 20 pixels and aligned to the left.
    </div>

</body>
</html>
