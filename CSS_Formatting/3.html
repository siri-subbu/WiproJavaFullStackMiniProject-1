<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Background Colors</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 15px;
            text-align: center;
        }

        h2 {
            background-color: #3498db;
            color: #ffffff;
            padding: 10px;
        }

        p {
            background-color: #e8f8f5;
            padding: 12px;
            border-left: 5px solid #1abc9c;
        }

        div {
            background-color: #fef9e7;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #f9e79f;
        }

        span {
            background-color: #f9d5e5;
            padding: 2px 6px;
            font-weight: bold;
        }

        footer {
            background-color: #333333;
            color: #ffffff;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Page Header</h1>
    </header>

    <h2>Section Heading</h2>

    <p>This is a paragraph with an independent background color and an inline <span>highlighted span element</span> inside it.</p>

    <div>
        <h3>Container Division</h3>
        <p style="background-color: #ffffff;">Nested paragraph with a white background.</p>
    </div>

    <footer>
        Page Footer Content
    </footer>

</body>
</html>
