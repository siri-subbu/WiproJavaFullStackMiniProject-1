<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineRead</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Base button styles */
        button {
            border: 1px solid #ccc;
            padding: 10px 18px;
            margin-right: 8px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Book Types background colors */
        .btn-all {
            background-color: #ffffff;
            color: #000000;
            border-color: #999;
        }

        .btn-kids {
            background-color: #00008b; /* Dark Blue */
            color: #ffffff;
        }

        .btn-teens {
            background-color: #28a745; /* Green */
            color: #ffffff;
        }

        .btn-scientific {
            background-color: #add8e6; /* Light Blue */
            color: #000000;
        }

        .btn-crime {
            background-color: #ffa500; /* Orange */
            color: #000000;
        }

        .btn-horror {
            background-color: #dc3545; /* Red */
            color: #ffffff;
        }

        .btn-feedback {
            background-color: #8b4513; /* Brown */
            color: #ffffff;
        }

        /* Font size buttons */
        .font-xl {
            font-size: 24px;
            padding: 12px 22px;
        }

        .font-lg {
            font-size: 18px;
            padding: 10px 18px;
        }

        .font-md {
            font-size: 14px;
            padding: 8px 14px;
        }

        .font-sm {
            font-size: 10px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <h1>OnlineRead</h1>

    <!-- Book Types Section -->
    <div class="section">
        <div class="section-title">Book Types:</div>
        <button class="btn-all">For All</button>
        <button class="btn-kids">Kids</button>
        <button class="btn-teens">Teens</button>
        <button class="btn-scientific">Scientific</button>
        <button class="btn-crime">Crime</button>
        <button class="btn-horror">Horror</button>
        <button class="btn-feedback">Feedback</button>
    </div>

    <!-- Comfort Font Size Section -->
    <div class="section">
        <div class="section-title">Comfort Font Size:</div>
        <button class="font-xl">A (Extra Large)</button>
        <button class="font-lg">A (Large)</button>
        <button class="font-md">A (Medium)</button>
        <button class="font-sm">A (Small)</button>
    </div>

</body>
</html>
