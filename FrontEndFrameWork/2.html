<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Contact List</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        /* Hover effect to highlight the hovered row */
        tbody tr:hover {
            background-color: #f2f2f2;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Friends Contact Table</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Contact No</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> Average</td>
                <td>9876543210</td>
            </tr>
            <tr>
                <td>Ball</td>
                <td>9123456780</td>
            </tr>
            <tr>
                <td>Cricket</td>
                <td>9988776655</td>
            </tr>
            <tr>
                <td>Drinks</td>
                <td>9848022338</td>
            </tr>
            <tr>
                <td>Elevation</td>
                <td>9701234567</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
