<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulips Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            padding: 15px;
            overflow: hidden;
        }

        .responsive-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLYK46v12mb63iFfTMi3epL4x6IikrCFiOWK5NxkNiqcxEBY82qomDLpMRHtHHRxyYLvBALMDj2JvnU8uPW9QgJ5hwLZ-y8ZyxSqAIPg&s=10" alt="Tulips" class="responsive-img">

</body>
</html>
