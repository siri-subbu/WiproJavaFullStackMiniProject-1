<!DOCTYPE html>
<html>
<head>
    <title>Phone Number Validation</title>
    <script>
        function validateForm() {
            var phoneField = document.getElementById("phone");
            var phoneValue = phoneField.value.trim();

            // 1. Must be entered
            if (phoneValue === "") {
                alert("Phone Number must be entered.");
                phoneField.focus();
                return false;
            }

            // 2. Must match XXX-XXX-XXXX, XXX.XXX.XXXX, or XXX XXX XXXX
            var phonePattern = /^\d{3}[-.\s]\d{3}[-.\s]\d{4}$/;

            if (!phonePattern.test(phoneValue)) {
                alert("Phone Number must follow one of these formats:\nXXX-XXX-XXXX\nXXX.XXX.XXXX\nXXX XXX XXXX");
                phoneField.focus();
                return false;
            }

            return true;
        }
    </script>
</head>
<body>

    <form action="" method="post" onsubmit="return validateForm()">
        <div>
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone">
        </div>
        <br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
