<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists Example</title>
</head>
<body>

    <h2>Top 5 Highest Mountain Peaks</h2>
    <ol>
        <li>Mount Everest</li>
        <li>K2</li>
        <li>Kangchenjunga</li>
        <li>Lhotse</li>
        <li>Makalu</li>
    </ol>

    <h2>Essential Hiking Gear</h2>
    <ul>
        <li>Navigation tools (map, compass, GPS)</li>
        <li>First aid kit</li>
        <li>Water bottle and purification tablets</li>
        <li>Sturdy hiking boots</li>
        <li>Weather-appropriate clothing</li>
    </ul>

</body>
</html>
