<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <script>
        function validateForm() {
            var memberNumField = document.getElementById("memberNum");
            var passwordField = document.getElementById("password");

            var memberNum = memberNumField.value.trim();
            var password = passwordField.value;

            // 1. Validate Member Number
            if (memberNum === "") {
                alert("Please enter the Member Number.");
                memberNumField.focus();
                return false;
            }

            if (isNaN(memberNum)) {
                alert("Member Number must be a valid number.");
                memberNumField.focus();
                return false;
            }

            // 2. Validate Password
            if (password === "") {
                alert("Please enter the Password.");
                passwordField.focus();
                return false;
            }

            if (password.length <= 4) {
                alert("Password must be longer than 4 characters.");
                passwordField.focus();
                return false;
            }

            // All validations passed
            return true;
        }
    </script>
</head>
<body>

    <form action="" method="post" onsubmit="return validateForm()">
        <div>
            <label for="memberNum">Member Number:</label>
            <input type="text" id="memberNum" name="memberNum">
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>
        <br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
