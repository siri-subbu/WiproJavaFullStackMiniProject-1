<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Convert Text to Upper Case</title>
</head>
<body>

    <h2>To Upper Case Example</h2>
    <p><strong>Original Text:</strong> <span id="original">hello world!</span></p>
    <p><strong>Uppercase Text:</strong> <strong id="result"></strong></p>

    <script>
        let text = "hello world!";
        let upperText = text.toUpperCase();

        document.getElementById("result").textContent = upperText;
    </script>

</body>
</html>
