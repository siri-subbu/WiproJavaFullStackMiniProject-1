<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Position of Substring</title>
</head>
<body>

    <h2>JavaScript indexOf() Example</h2>
    <p><strong>Text:</strong> <span id="text">Hello World! Welcome to the World of JavaScript.</span></p>
    <p><strong>Position of "World":</strong> <span id="result"></span></p>

    <script>
        let txt = "Hello World! Welcome to the World of JavaScript.";
        let position = txt.indexOf("World");

        document.getElementById("result").textContent = position;
    </script>

</body>
</html>
