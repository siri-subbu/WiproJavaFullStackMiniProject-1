<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Clock</title>
</head>
<body onload="updateTime()">

    <label for="timeBox">Current Time:</label>
    <input type="text" id="timeBox" readonly>

    <script>
        function updateTime() {
            var now = new Date();
            
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();

            // Add leading zero if less than 10
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            // Display time in HH:MM:SS format
            document.getElementById("timeBox").value = hours + ":" + minutes + ":" + seconds;

            // Call function again after 1000 milliseconds (1 second)
            setTimeout(updateTime, 1000);
        }
    </script>

</body>
</html>
