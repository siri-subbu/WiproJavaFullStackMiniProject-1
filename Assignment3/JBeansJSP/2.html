<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input Form</title>
</head>
<body>

    <h2>Route Request by Value</h2>

    <form action="RouteServlet" method="get">
        <label for="operation">Enter a Number:</label>
        <input type="number" id="operation" name="operation" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
