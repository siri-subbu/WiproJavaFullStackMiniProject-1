<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Salary Input Form</title>
</head>
<body>

    <h2>Employee Salary Details Form</h2>

    <form action="calculateSalary.jsp" method="post">
        <table>
            <tr>
                <td>Employee ID:</td>
                <td><input type="number" name="empId" required></td>
            </tr>
            <tr>
                <td>Employee Name:</td>
                <td><input type="text" name="empName" required></td>
            </tr>
            <tr>
                <td>Basic Salary:</td>
                <td><input type="number" step="0.01" name="basicSalary" required></td>
            </tr>
            <tr>
                <td>HRA (House Rent Allowance):</td>
                <td><input type="number" step="0.01" name="hra" required></td>
            </tr>
            <tr>
                <td>DA (Dearness Allowance):</td>
                <td><input type="number" step="0.01" name="da" required></td>
            </tr>
            <tr>
                <td>Deductions (Tax, PF, etc.):</td>
                <td><input type="number" step="0.01" name="deductions" required></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Calculate Salary">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
