<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prime Number Generator</title>
</head>
<body>

    <h2>Enter a Number to Find Smaller Primes</h2>

    <form action="PrimeServlet" method="post">
        <label for="limit">Enter Number:</label>
        <input type="number" id="limit" name="limit" min="2" required>
        <br><br>
        <input type="submit" value="Generate Primes">
    </form>

</body>
</html>
