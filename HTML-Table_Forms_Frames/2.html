<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Information</title>
</head>
<body>

    <h1>Visitors information</h1>
    <hr>
    <form action="#" method="post">
        <table cellpadding="6" cellspacing="0">
            <tr>
                <td><label for="email"><strong>Email Address:</strong></label></td>
                <td>
                    <input type="email" id="email" name="email" required>
                </td>
            </tr>

            <tr>
                <td><strong>Interest:</strong></td>
                <td>
                    <input type="checkbox" id="research" name="interest" value="research">
                    <label for="research">Research</label>
                    <input type="checkbox" id="purchase" name="interest" value="purchase">
                    <label for="purchase">Purchase</label>
                </td>
            </tr>

            <tr>
                <td><label for="occupation"><strong>Occupation:</strong></label></td>
                <td>
                    <select id="occupation" name="occupation">
                        <option value="" selected>(select one)</option>
                        <option value="student">Student</option>
                        <option value="employed">Employed</option>
                        <option value="self-employed">Self-Employed</option>
                        <option value="retired">Retired</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><strong>Want us to send you junk emails?</strong></td>
                <td>
                    <input type="radio" id="junk-yes" name="junk_email" value="absolutely">
                    <label for="junk-yes">absolutely</label>
                    <input type="radio" id="junk-no" name="junk_email" value="no_way_man">
                    <label for="junk-no">no way man</label>
                </td>
            </tr>

            <tr>
                <td >
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
