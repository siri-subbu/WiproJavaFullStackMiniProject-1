<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Div Element</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .scaled-box {
            width: 100px;
            height: 60px;
            background-color: #3498db;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 14px;
            border-radius: 4px;
            
            transform: scale(2, 3);
        }
    </style>
</head>
<body>

    <div class="scaled-box">
        Scaled Div
    </div>

</body>
</html>
