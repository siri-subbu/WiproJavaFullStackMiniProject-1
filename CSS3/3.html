<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Text with Black Shadow</title>
    <style>
        body {
            background-color: #888888;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .text-shadow {
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>

    <div class="text-shadow">
        White Text with Black Shadow
    </div>

</body>
</html>
