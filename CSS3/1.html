<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Div Element</title>
    <style>
        .custom-box {
            border: 2px solid;
            padding: 20px;
            background-color: #dddddd;
            border-top-left-radius: 2em;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="custom-box">
        This div element is styled with a 2px solid border, 20px padding, a #dddddd background color, and a 2em top-left border radius.
    </div>

</body>
</html>
