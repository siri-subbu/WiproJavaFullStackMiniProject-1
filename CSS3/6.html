<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Div Counter-Clockwise</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .rotated-box {
            width: 250px;
            padding: 20px;
            background-color: #4CAF50;
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: rotate(-20deg);
        }
    </style>
</head>
<body>

    <div class="rotated-box">
        This div is rotated 20 degrees counter-clockwise.
    </div>

</body>
</html>
