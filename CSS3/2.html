<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow (H-Shadow)</title>
    <style>
        .shadow-div {
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: #333333;
            padding: 20px;
            text-shadow: 6px 0px 0px #888888;
        }
    </style>
</head>
<body>

    <div class="shadow-div">
        Text with Horizontal Shadow (h-shadow)
    </div>

</body>
</html>
