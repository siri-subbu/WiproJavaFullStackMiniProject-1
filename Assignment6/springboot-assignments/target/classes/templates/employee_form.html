<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Employee Form</title></head>
<body>
    <h2 th:text="${employee.id != null} ? 'Edit Employee' : 'Add Employee'">Employee Form</h2>
    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Name:</label>
        <input type="text" th:field="*{name}" required /><br/><br/>
        <label>Designation:</label>
        <input type="text" th:field="*{designation}" required /><br/><br/>
        <label>Salary:</label>
        <input type="number" step="0.01" th:field="*{salary}" required /><br/><br/>
        <button type="submit">Save</button>
    </form>
    <br/>
    <a href="/employees">Back to Employee List</a>
</body>
</html>
