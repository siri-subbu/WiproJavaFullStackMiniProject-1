<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task 4: Employee Management System</title>
    <style>
        table { border-collapse: collapse; width: 60%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Employee Management System (Spring Boot + JPA + H2)</h2>
    <a href="/employees/new">+ Add New Employee</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}">1</td>
                <td th:text="${emp.name}">John</td>
                <td th:text="${emp.designation}">Developer</td>
                <td th:text="${emp.salary}">50000</td>
                <td>
                    <a th:href="@{/employees/edit/{id}(id=${emp.id})}">Edit</a> |
                    <a th:href="@{/employees/delete/{id}(id=${emp.id})}" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5">No employees found. Add one above!</td>
            </tr>
        </tbody>
    </table>
    <br/>
    <a href="/">Back to Home</a>
</body>
</html>
